name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      # The nexrad image would otherwise spend the run downloading a full
      # CONUS cycle from NOAA. One station keeps the stack honest without
      # leaning on a third party for volume.
      - name: Run integration tests
        env:
          ORION_NEXRAD_STATIONS: KOHX
          ORION_NEXRAD_BOUNDS: "-91.5,33.0,-81.0,39.0"
        run: uv run pytest tests/integration

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.2.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: isaiah-harville/orion

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # The release tag is the single source of truth for the version: it names
      # every image tag, the chart version, and the chart's appVersion, so one
      # release can never mix components from different builds.
      - id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Helm requires strict SemVer for a chart version.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${version}' is not valid SemVer, so Helm will reject it." \
                 "Pre-releases need a hyphen: v0.2.0-rc1, not v0.2.0rc1."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile
            target: api
          - name: nexrad
            dockerfile: deploy/Dockerfile
            target: nexrad
          - name: gui
            dockerfile: deploy/gui/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/orion-${{ matrix.name }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/orion-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  chart:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Publish chart
        run: |
          version="${{ needs.version.outputs.version }}"
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}
          helm package deploy/helm/orion \
            --version "${version}" \
            --app-version "${version}" \
            --destination dist
          helm push "dist/orion-${version}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.NAMESPACE }}/charts"

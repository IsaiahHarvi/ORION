services:
  gui:
    build:
      context: .
      dockerfile: deploy/gui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5171/api}
    image: "ghcr.io/isaiah-harville/orion/orion-gui:${ORION_VERSION:-latest}"
    ports:
      - "5173:5173"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
      args:
        VITE_API_URL: ${VITE_API_URL:-https://orion.harville.dev/api}
    image: "ghcr.io/isaiah-harville/orion/orion-api:${ORION_VERSION:-latest}"
    environment:
      # ORION_MOSAIC_DIR derives from SCAN_DIR, so it is not set separately.
      SCAN_DIR: /app/scans
      VITE_API_URL: ${VITE_API_URL:-production}
    ports:
      - "5171:5171"
    volumes:
      - radar-data:/app/scans:ro

  nexrad:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: nexrad
    image: "ghcr.io/isaiah-harville/orion/orion-nexrad:${ORION_VERSION:-latest}"
    platform: linux/amd64
    environment:
      SCAN_DIR: /app/scans
      ORION_RADAR_STATIONS: ${ORION_RADAR_STATIONS:-ALL}
      ORION_RADAR_BOUNDS: ${ORION_RADAR_BOUNDS:--125.0,24.0,-66.5,49.5}
      ORION_RADAR_HISTORY_HOURS: ${ORION_RADAR_HISTORY_HOURS:-6}
    volumes:
      - radar-data:/app/scans

volumes:
  radar-data:

networks:
  default:
    name: orion

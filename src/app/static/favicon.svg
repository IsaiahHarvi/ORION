	<circle cx="32" cy="32" r="23" fill="none" stroke="#1f9be6" stroke-opacity="0.32" stroke-width="4" />
	<path d="M32 32 L32 9 A23 23 0 0 1 55 32 Z" fill="#1f9be6" />
</svg>

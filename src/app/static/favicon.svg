<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ORION">
	<title>ORION</title>
	<!-- Deliberately three bold shapes and no fine detail: a favicon is read at
	     16px, where thin strokes and small features collapse into a smudge. -->

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion
  labels:
    app: orion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion
  template:
    metadata:
      labels:
        app: orion
    spec:
      containers:
        - name: api
          image: ghcr.io/isaiah-harville/orion/orion-api:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 5171
          env:
            - name: ORION_MOSAIC_DIR
              value: /app/scans/mosaic
          volumeMounts:
            - name: radar-data
              mountPath: /app/scans
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5171
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5171
            initialDelaySeconds: 10
            periodSeconds: 20
        - name: radar-producer
          image: ghcr.io/isaiah-harville/orion/orion-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "services.radar.producer"]
          env:
            - name: SCAN_DIR
              value: /app/scans
            - name: ORION_MOSAIC_DIR
              value: /app/scans/mosaic
            - name: ORION_RADAR_STATIONS
              value: ALL
            - name: ORION_RADAR_BOUNDS
              value: "-125.0,24.0,-66.5,49.5"
            - name: ORION_RADAR_INGEST_WORKERS
              value: "8"
            - name: ORION_RADAR_KEEP_RAW
              value: "false"
            - name: ORION_RADAR_RAW_RETENTION_SECONDS
              value: "1800"
          volumeMounts:
            - name: radar-data
              mountPath: /app/scans
        - name: gui
          image: ghcr.io/isaiah-harville/orion/orion-gui:latest
          imagePullPolicy: Always
          ports:
            - name: gui
              containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "https://orion.harville.dev/api"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: radar-data
          emptyDir: {}

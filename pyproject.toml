[project]
name = "orion"
version = "0.1.1"
description = "Observation, Reconnaissance, Intelligence, and Operations Network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arm-pyart>=2.2",
    "boto3>=1.43",
    "fastapi>=0.141",
    "geopy>=2.5",
    "mercantile>=1.2",
    "numpy>=2.5",
    "pandas>=3.0",
    "pillow>=12.3",
    "pyproj>=3.7",
    "rasterio>=1.5",
    "scipy>=1.18",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/services"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]
